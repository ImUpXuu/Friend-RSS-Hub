name: Vercel Auto-Trigger

on:
  schedule:
    # Run every 6 hours (at minute 0 of every 6th hour)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update Trigger File
        run: |
          echo "Last sync: $(date -u '+%Y-%m-%d %H:%M:%S') UTC" > vercel-trigger.txt

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel-trigger.txt
          git commit -m "chore: auto-update heartbeat to trigger Vercel sync" || exit 0
          git push
